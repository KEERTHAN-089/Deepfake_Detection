name: Backend image

# Builds the FastAPI + model image and publishes it to GitHub Container Registry.
# Azure Container Apps pulls it from ghcr.io/<owner>/deepscan-api.
on:
  push:
    branches: [main, redesign-and-deploy]
    paths:
      - "Deepfake/python-backend/main.py"
      - "Deepfake/python-backend/requirements.txt"
      - "Deepfake/python-backend/Dockerfile"
      - "Deepfake/xception_lstm_20260129_074841/**"
      - ".github/workflows/backend-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Stage build context
        run: |
          mkdir -p build/model
          cp Deepfake/python-backend/{main.py,requirements.txt,Dockerfile} build/
          cp Deepfake/xception_lstm_20260129_074841/{best_model.pth,results.json} build/model/
          # Fail fast if LFS gave us a pointer file instead of the real weights.
          test "$(stat -c %s build/model/best_model.pth)" -gt 100000000

      - name: Image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/deepscan-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: build
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
